# =============================================================================
# Backup database — ZIP-ZIPS LAUNDRI
# =============================================================================
# Supabase Free TIDAK menyediakan auto-backup, jadi backup dijadwalkan di sini.
#
# Alur:
#   cron (02:00 WIB) → pg_dump → gzip → artifact GitHub (retensi 14 hari)
#
# Secret yang dibutuhkan (Settings → Secrets and variables → Actions):
#   DATABASE_URL  = postgresql://...@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
#
# Catatan:
# - Secret TIDAK ditulis di file ini.
# - Workflow ini juga menyalakan Supabase Free agar project tidak ter-pause
#   (pause otomatis setelah 7 hari tanpa koneksi) — query SELECT 1 sudah cukup.
# - Retensi artifact 14 hari. Untuk penyimpanan jangka panjang, salin artifact
#   ke penyimpanan lain (lihat docs/architecture.md § 6.6).
# =============================================================================

name: Backup Database

on:
  schedule:
    # 19:00 UTC = 02:00 WIB (UTC+7).
    - cron: '0 19 * * *'
  workflow_dispatch:
    # Jalankan manual kapan saja, mis. sebelum migrasi berisiko.

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    name: Dump & simpan artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client terbaru
        run: |
          set -euo pipefail
          # pg_dump versi lama TIDAK bisa membuka server PostgreSQL yang lebih
          # baru (mis. client 16 vs Supabase 17/18). Pasang client terbaru dari
          # repositori resmi PGDG, bukan paket bawaan Ubuntu yang sering
          # tertinggal satu versi.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq

          PG_CLIENT_VERSION="$(apt-cache search --names-only '^postgresql-client-[0-9]+$' \
            | awk '{print $1}' \
            | sed 's/^postgresql-client-//' \
            | sort -V \
            | tail -n1)"
          if [ -z "$PG_CLIENT_VERSION" ]; then
            echo "::error::Tidak menemukan paket postgresql-client dari PGDG."
            exit 1
          fi
          sudo apt-get install -y -qq --no-install-recommends "postgresql-client-${PG_CLIENT_VERSION}"

          PG_DUMP="/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/pg_dump"
          PSQL="/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin/psql"
          echo "PG_DUMP=$PG_DUMP" >> "$GITHUB_ENV"
          echo "PSQL=$PSQL" >> "$GITHUB_ENV"
          "$PG_DUMP" --version

      - name: Normalisasi connection string untuk libpq
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret DATABASE_URL belum diisi. Set di Settings → Secrets and variables → Actions."
            exit 1
          fi

          # DATABASE_URL dipakai Prisma, jadi bisa berisi parameter khusus
          # Prisma yang tidak dikenal psql/pg_dump (schema, connection_limit,
          # pool_timeout, pgbouncer, ...). Buang parameter itu, pertahankan
          # sslmode, dan ubah sslmode=no-verify (khusus Prisma) menjadi require.
          PG_URL="$(node -e '
            const u = new URL(process.env.DATABASE_URL)
            for (const key of [
              "schema",
              "connection_limit",
              "pool_timeout",
              "pgbouncer",
              "statement_cache_size",
              "socket_timeout",
            ]) {
              u.searchParams.delete(key)
            }
            if (u.searchParams.get("sslmode") === "no-verify") {
              u.searchParams.set("sslmode", "require")
            }
            process.stdout.write(u.toString())
          ')"
          echo "PG_URL=$PG_URL" >> "$GITHUB_ENV"

      - name: Cek koneksi database
        run: |
          set -euo pipefail
          # Mencegah project Supabase Free ter-pause (idle 7 hari).
          "$PSQL" "$PG_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1' > /dev/null
          echo "Koneksi database OK."

      - name: Dump database
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          OUT="backup-zipzips-${STAMP}.sql"

          # --clean --if-exists : DROP ... IF EXISTS, aman untuk restore
          # --no-owner --no-privileges : hasil dump tidak terikat role khusus
          # --format=plain : SQL teks, mudah dibaca & dipulihkan manual
          "$PG_DUMP" "$PG_URL" \
            --format=plain \
            --clean --if-exists \
            --no-owner --no-privileges \
            --file "$OUT"

          gzip -9 "$OUT"
          echo "Dump selesai: ${OUT}.gz"
          ls -lh "${OUT}.gz"

          # Simpan nama file untuk langkah upload.
          echo "FILE_NAME=${OUT}.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: ${{ env.FILE_NAME }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Ringkasan
        if: always()
        run: |
          echo "### Backup database selesai"
          echo "- Waktu (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "- Run: #${{ github.run_number }}"
          echo "- Retensi artifact: 14 hari"
